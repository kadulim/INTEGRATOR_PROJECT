<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — CoByte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-shell">
  <div class="login-brand">
    <div class="brand-content">
      <div class="brand-logo">
        <div class="brand-icon">C</div>
        <span class="brand-name">Co<em>Byte</em></span>
      </div>
      <div class="brand-headline">
        <h2>Cadastre sua<br>empresa hoje.</h2>
        <p>Acesse o portal do cliente e acompanhe seus projetos em tempo real.</p>
      </div>
    </div>
    <div class="brand-bg-pattern"></div>
  </div>

  <div class="login-form-panel">
    <div class="login-card fade-up">
      <div class="lc-header">
        <h1>Criar conta</h1>
        <p>Preencha os dados para se registrar como cliente</p>
      </div>

      <form class="lc-form" method="POST" action="/register">
        {% if error %}
        <div class="error-msg" style="display:block;">{{ error }}</div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="nome">Nome Completo</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input class="form-input with-icon" type="text" id="nome" name="nome" placeholder="Seu nome" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input class="form-input with-icon" type="email" id="email" name="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="empresa">Empresa</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </span>
            <input class="form-input with-icon" type="text" id="empresa" name="empresa" placeholder="Nome da empresa" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="form-input with-icon" type="password" id="senha" name="senha" placeholder="••••••••" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmar_senha">Confirmar Senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="form-input with-icon" type="password" id="confirmar_senha" name="confirmar_senha" placeholder="••••••••" required minlength="6">
          </div>
        </div>

        <button class="btn btn-primary btn-lg w-full" type="submit">Criar Conta</button>
      </form>

      <div style="text-align:center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
        Já tem uma conta? <a href="/" style="color: var(--accent); font-weight: 600;">Faça login</a>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
