<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CoByte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-shell">
  <!-- Painel Esquerdo -->
  <div class="login-brand">
    <div class="brand-content">
      <div class="brand-logo">
        <div class="brand-icon">C</div>
        <span class="brand-name">Co<em>Byte</em></span>
      </div>
      <div class="brand-headline">
        <h2>Gerencie projetos<br>com precisão.</h2>
        <p>Uma plataforma completa para equipes que entregam resultados.</p>
      </div>

    </div>
    <div class="brand-bg-pattern"></div>
  </div>

  <!-- Painel Direito: Formulário -->
  <div class="login-form-panel">
    <div class="login-card fade-up">
      <div class="lc-header">
        <h1>Entrar na conta</h1>
        <p>Use as credenciais fornecidas pela sua equipe</p>
      </div>

      <form class="lc-form" method="POST" action="/">
        {% if error %}
        <div id="error-msg" class="error-msg" style="display:block;">{{ error }}</div>
        {% endif %}
        <div class="form-group">
          <label class="form-label" for="identificador">Usuário ou E-mail</label>
          <div class="input-wrap">
            <span class="input-icon" id="identificador-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input
              class="form-input with-icon"
              type="text"
              id="identificador"
              name="identificador"
              placeholder="nome.usuario ou email@exemplo.com"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              class="form-input with-icon"
              type="password"
              id="password"
              name="senha"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
          </div>
        </div>
        <button class="btn btn-primary btn-lg w-full" type="submit" id="submit-btn">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
