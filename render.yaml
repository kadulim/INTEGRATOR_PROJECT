services:
  - type: web
    name: project-integrator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: integrator-db
          property: connectionString
      - key: RENDER
        value: "true"

databases:
  - name: integrator-db
    databaseName: database_cobyte
    region: ohio
    plan: free
